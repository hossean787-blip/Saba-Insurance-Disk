name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android command-line tools
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl --fail --location --retry 3 --output /tmp/cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q /tmp/cmdline-tools.zip -d /tmp
          mv /tmp/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Configure persistent signing
        env:
          SABA_KEYSTORE_BASE64: ${{ secrets.SABA_KEYSTORE_BASE64 }}
          SABA_KEYSTORE_PASSWORD: ${{ secrets.SABA_KEYSTORE_PASSWORD }}
          SABA_KEY_ALIAS: ${{ secrets.SABA_KEY_ALIAS }}
          SABA_KEY_PASSWORD: ${{ secrets.SABA_KEY_PASSWORD }}
        run: |
          if [ -n "$SABA_KEYSTORE_BASE64" ]; then
            printf '%s' "$SABA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/saba-signing.jks"
            echo "SABA_KEYSTORE_PATH=$RUNNER_TEMP/saba-signing.jks" >> "$GITHUB_ENV"
            echo "SABA_KEYSTORE_PASSWORD=$SABA_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "SABA_KEY_ALIAS=$SABA_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "SABA_KEY_PASSWORD=$SABA_KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "::error::Stable signing secrets are required to produce an installable upgrade APK."
            echo "Unsigned verification only: using Android debug signing for test APK."
          fi
      - name: Compile and test
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Saba-Insurance-Disk-test-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
