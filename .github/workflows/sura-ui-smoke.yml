name: SURA UI navigation smoke and screenshots
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sura-ui-smoke.yml'

jobs:
  ui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android command-line tools
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl --fail --location --retry 3 --output /tmp/cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q /tmp/cmdline-tools.zip -d /tmp
          mv /tmp/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug app
        run: gradle --no-daemon :app:assembleDebug
      - name: Run emulator and capture screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect -memory 1536
          script: bash .github/scripts/sura-ui-smoke.sh
      - name: Upload UI screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SURA-UI-v0.6.0-screenshots
          path: ui-artifacts/
          if-no-files-found: warn
